<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripture Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=Amiri:wght@400;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #8a6d2f;
    --dark: #0d0c0a;
    --dark2: #141310;
    --dark3: #1c1a17;
    --dark4: #252320;
    --text: #f0ead8;
    --text-dim: #a89e87;
    --text-muted: #6b6352;
    --border: rgba(201,168,76,0.15);
    --border-bright: rgba(201,168,76,0.4);
    --good: #7ec99a;
    --warn: #d8b76a;
    --bad: #e27a7a;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.6;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(201,168,76,0.03) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(201,168,76,0.03) 60px);
    pointer-events: none; z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 1.5rem 4rem; }

  header { text-align: center; padding: 2.5rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.75rem; }
  .logo-mark { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: .75rem; }
  header h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 300; line-height: 1.1; }
  header h1 em { font-style: italic; color: var(--gold-light); }

  /* ---- Controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
  .field { display: flex; align-items: center; gap: .5rem; }
  .field label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  select {
    background: var(--dark3); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: .4rem .6rem; font-family: inherit; font-size: 13px; font-weight: 300;
  }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  select:disabled { opacity: .45; }

  .mic-section { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 1.75rem; }
  .mic-ring {
    width: 92px; height: 92px; border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .3s;
  }
  .mic-ring.listening { border-color: var(--gold); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.3); }
    50% { box-shadow: 0 0 0 14px rgba(201,168,76,0); }
  }
  @media (prefers-reduced-motion: reduce) { .mic-ring.listening { animation: none; } }

  .mic-btn {
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--dark3); border: 1px solid var(--border-bright);
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s;
  }
  .mic-btn:hover:not(:disabled) { background: var(--dark4); border-color: var(--gold); }
  .mic-btn.active { background: var(--gold-dim); border-color: var(--gold); }
  .mic-btn:disabled { opacity: .4; cursor: not-allowed; }
  .mic-btn svg { width: 25px; height: 25px; stroke: var(--gold); fill: none; stroke-width: 1.5; }

  .status { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); text-align: center; }
  .status.listening { color: var(--gold); }
  .status.good { color: var(--good); }
  .status.warn { color: var(--warn); }
  .status.bad { color: var(--bad); text-transform: none; letter-spacing: 0; font-size: 13px; max-width: 46ch; }

  .progress { width: 200px; height: 2px; background: var(--dark3); border-radius: 2px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }

  /* ---- Transcript ---- */
  .transcript {
    background: var(--dark2); border: 1px solid var(--border); border-radius: 8px;
    padding: .9rem 1.15rem; min-height: 52px; margin-bottom: 1.25rem;
    font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic;
    color: var(--text-dim);
  }
  .transcript .hint { color: var(--text-muted); font-size: .88rem; font-style: normal; font-family: 'DM Sans', sans-serif; }

  /* ---- Verse card ---- */
  .verse { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--dark2); margin-bottom: 1.25rem; display: none; }
  .verse.visible { display: block; }
  .verse.uncertain { border-color: rgba(216,183,106,.35); }
  .verse.guess { border-style: dashed; }

  .verse-head { background: var(--dark3); border-bottom: 1px solid var(--border); padding: .7rem 1.15rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .verse-ref { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
  .verse-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: .5rem; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }

  .verse-body { padding: 1.25rem 1.25rem 1rem; }
  .verse-text { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.15rem, 3vw, 1.5rem); font-weight: 400; line-height: 1.65; color: var(--text); }
  .verse-text[dir="rtl"] { font-family: 'Amiri', 'Geeza Pro', serif; font-size: clamp(1.4rem, 4vw, 1.9rem); line-height: 2.1; }

  .verse-translation {
    margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--border);
    font-size: .95rem; line-height: 1.65; color: var(--text-dim); font-weight: 300;
  }
  .verse-translation .attribution {
    display: block; margin-top: .4rem; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-muted);
  }

  .notice { margin-top: .9rem; padding: .6rem .8rem; border-radius: 6px; font-size: 12px; line-height: 1.5; background: rgba(216,183,106,.08); border: 1px solid rgba(216,183,106,.25); color: var(--text-dim); }

  .alts { margin-top: .9rem; display: none; flex-direction: column; gap: .4rem; }
  .alts.visible { display: flex; }
  .alts-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  .alt { background: var(--dark3); border: 1px solid var(--border); border-radius: 6px; padding: .5rem .7rem; cursor: pointer; text-align: left; color: var(--text-dim); font-family: inherit; font-size: 12px; display: flex; gap: .6rem; align-items: baseline; width: 100%; }
  .alt:hover { border-color: var(--border-bright); color: var(--text); }
  .alt .r { color: var(--gold); white-space: nowrap; font-weight: 500; }
  .alt .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .alt .t[dir="rtl"] { font-family: 'Amiri', 'Geeza Pro', serif; text-align: right; }

  /* ---- Manual override ---- */
  .manual { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  .manual input {
    flex: 1; background: var(--dark2); border: 1px solid var(--border); border-radius: 6px;
    padding: .55rem .8rem; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 300;
  }
  .manual input::placeholder { color: var(--text-muted); }
  .manual input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .manual button { background: var(--dark3); border: 1px solid var(--border-bright); color: var(--gold); border-radius: 6px; padding: .55rem 1rem; cursor: pointer; font-family: inherit; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .manual button:hover { background: var(--dark4); }

  .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0 1rem; }
  .divider span { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .history { display: none; flex-direction: column; gap: 8px; }
  .history.visible { display: flex; }
  .hist { background: var(--dark2); border: 1px solid var(--border); border-radius: 8px; padding: .65rem .9rem; cursor: pointer; display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%; font-family: inherit; }
  .hist:hover { border-color: var(--border-bright); }
  .hist .r { font-size: 11px; color: var(--gold); font-weight: 500; white-space: nowrap; }
  .hist .t { font-family: 'Cormorant Garamond', serif; font-size: .9rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer { text-align: center; padding-top: 2rem; margin-top: 2rem; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; line-height: 1.8; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo-mark">&#10022; Scripture Live</div>
    <h1>Speak a verse,<br><em>see it appear.</em></h1>
  </header>

  <div class="controls">
    <div class="field">
      <label for="corpus">Text</label>
      <select id="corpus"></select>
    </div>
    <div class="field">
      <label for="engine">Recognition</label>
      <select id="engine"></select>
    </div>
  </div>

  <section class="mic-section">
    <div class="mic-ring" id="ring">
      <button class="mic-btn" id="mic" aria-label="Start listening" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="9" y1="22" x2="15" y2="22"/>
        </svg>
      </button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Loading the text&hellip;</p>
    <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
  </section>

  <div class="transcript" id="transcript"><span class="hint">Spoken words appear here.</span></div>

  <article class="verse" id="verse" aria-live="polite">
    <div class="verse-head">
      <span class="verse-ref" id="ref">&mdash;</span>
      <span class="verse-meta"><span class="dot" id="dot"></span><span id="meta">&mdash;</span></span>
    </div>
    <div class="verse-body">
      <p class="verse-text" id="text"></p>
      <p class="verse-translation" id="translation" hidden></p>
      <p class="notice" id="notice" hidden></p>
      <div class="alts" id="alts">
        <span class="alts-label">Did you mean</span>
        <div id="altList"></div>
      </div>
    </div>
  </article>

  <form class="manual" id="manual">
    <label class="sr-only" for="query">Search for a verse by words or reference</label>
    <input id="query" type="search" placeholder="Or type words from a verse&hellip;" autocomplete="off">
    <button type="submit">Find</button>
  </form>

  <div class="divider"><span>Session history</span></div>
  <div class="history" id="history"></div>

  <footer id="footer">Speech recognition runs in your browser.</footer>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
